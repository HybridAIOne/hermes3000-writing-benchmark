# Fixture: Sanatorium Belmont, 36 entities (written for Hermes 3000's worldbuilding evaluation, CC BY 4.0 like all tasks).
# The context is frozen text: every model gets exactly the same book knowledge, including the
# summaries of LATER chapters — the author knows the whole plan, the chapter must not leak it.
system: |
  Du bist der Schreibassistent in einem Buch-Editor. Du schreibst Buchtext im Stil und in der
  Sprache des Manuskripts und hältst dich an alles, was im Buchkontext über Figuren, Orte und den
  Stand der Handlung festgelegt ist. Gib ausschließlich den Buchtext aus — keine Vorrede, keine
  Überschrift, keine Erklärungen.
prompt: |
  BUCHKONTEXT:
  {{context}}

  AUFGABE: Schreibe das vierte Kapitel (ca. 600-800 Woerter). Der Journalist Matthias Vossberg, der entfremdete Sohn des Chefarztes, reist ueber den kaum passierbaren Pass an, um den Brand von 1919 zu recherchieren. Eisige Vater-Sohn-Begegnung. Frau Goss kommentiert beilaeufig, wer da gekommen ist. Elises Verdacht richtet sich nach aussen.
context: |
  TITEL: Sanatorium Belmont
  PLOT: Winter 1923, Schweizer Alpen. Die 34-jaehrige Elise Vanderhoek wird halb erfroren ins abgelegene Sanatorium Haus Belmont gebracht, nachdem ihr Schlitten auf dem Belmontpass verunglueckte. Ihr Bruder Konrad gilt seither als tot, und Elise leidet an einer Teilamnesie: Sie erinnert die Fahrt nicht. Der Pass ist von November bis April zugeschneit, die Welt abgeschnitten. Chefarzt Dr. Adrian Vossberg behandelt sie mit Hypnose und seiner Methode des 'kontrollierten Vergessens'; sein junger Assistent Dr. Adrian Vosskuhl widerspricht leise und plaediert fuer Gespraechstherapie. Stueck fuer Stueck entdeckt Elise, dass ihr Unfall, der vermeintliche Tod ihres Bruders und ein vertuschter Brand von 1919 im versiegelten Ostfluegel zusammenhaengen — und dass Vossbergs 'Heilung' Teil der Vertuschung ist. Die Schlafwandlerin Thea liefert erste Hinweise, der angereiste Journalist Matthias Vossberg (Vossbergs entfremdeter Sohn) ermittelt, ein Telegramm enthuellt, dass Konrad lebt, und der gestohlene Ostfluegelschluessel oeffnet schliesslich die Wahrheit. Im Tauwetter waehlt Elise, was sie erinnern will. Eskalation Kapitel fuer Kapitel: Ankunft -> Hypnose -> erster Riss -> aeussere Bedrohung -> Wendepunkt (Telegramm) -> Einbruch in den Ostfluegel -> Wiedersehen -> Beichte/Enthuellung -> Aufloesung.
  STIL: Literarisch, nahe dritte Person auf Elise, gegenwaertige Innensicht, die in Erinnerungsfragmente kippt. Sensorische Kaelte-Bilder (Schnee, Eis, Atemwolken, Messing, Karbol). Langsam brennende Bedrohung, unzuverlaessiges Gedaechtnis. Register: gehobenes literarisches Deutsch im Ton von W.G. Sebald trifft Shirley Jackson. KEINE Genre-Klischees, kein expliziter Horror, keine Erklaer-Saetze; Andeutung statt Aussprache. Dialoge knapp und unterkuehlt. Absatzlaenge variabel; keine Kapitelueberschriften im Text.
  FIGUREN:
  - Elise Vanderhoek | Alter: 34 | Rolle: Protagonistin / POV | Aussehen: Schmal, dunkelblondes Haar, grau-gruene Augen. Traegt stets das silberne Medaillon ihrer Familie. | Beschreibung: Belgische Uebersetzerin aus Antwerpen. Kam halb erfroren nach einem Schlittenunglueck auf dem Belmontpass nach Belmont; leidet an Teilamnesie und erinnert die Unfallfahrt nicht. Vermutet insgeheim, dass sie absichtlich nach Belmont kam, nicht durch Zufall. | Innerer Konflikt: Sehnsucht zu erinnern vs. blanke Angst vor dem, was die Erinnerung freilegt. Schuldgefuehl, den Bruder 'verloren' zu haben. | Entwicklung: Verleugnung (K1-2) -> erste Risse durch fremde Hinweise (K3-4) -> Schock und Entschluss (K5) -> aktive Konfrontation (K6) -> Versoehnung und zurueckkehrende Erinnerung (K7) -> bewusste Wahl, was sie erinnern will (K9).
  - Dr. Adrian Vossberg | Alter: 58 | Rolle: Antagonist / Chefarzt | Aussehen: Hochgewachsen, silberner Vollbart, BLAUE Augen. Hinkt links (alte Kriegsverletzung), silbergriffiger Stock. | Beschreibung: Gruender und Chefarzt von Haus Belmont. Kuehl, methodisch, autoritaer. Glaubt an Hypnose und 'kontrolliertes Vergessen' als Heilung. Vater von Matthias Vossberg. | Innerer Konflikt: Verbirgt, dass seine Methode 1919 einen Patienten das Leben kostete; seine Starre ist Schuld-Panzer. Angst vor Entlarvung. | Entwicklung: Unangefochtene Autoritaet (K1-4) -> erste Risse, als der Sohn anreist (K4) -> Defensive (K6) -> Zusammenbruch und Entlarvung in der Beichte (K8).
  - Dr. Adrian Vosskuhl | Alter: 31 | Rolle: Verbuendeter / Assistenzarzt | Aussehen: Mittelgross, glattrasiert, BRAUNE Augen, randlose Brille. Kein Stock, kein Hinken. | Beschreibung: Junger Assistenzarzt unter Vossberg. Warmherzig, idealistisch. LEHNT Hypnose ab und plaediert fuer Gespraechstherapie. NICHT verwandt mit Vossberg — nur namensaehnlich. | Innerer Konflikt: Loyalitaet zum Mentor Vossberg vs. eigenes Gewissen. Furcht, ohne Vossbergs Protektion nichts zu sein. | Entwicklung: Ehrerbietung (K1-2) -> wachsender Zweifel (K4) -> offener Widerstand und Buendnis mit Elise (K8) -> Verantwortungsuebernahme im Tauwetter (K9).
  - Matthias Vossberg | Alter: 30 | Rolle: Ermittler / Journalist | Aussehen: Hager, dunkles Haar, GRAUE Augen, Lederreisemantel, Notizbuch stets dabei. | Beschreibung: Entfremdeter Sohn des Chefarztes Adrian Vossberg. Journalist aus Bern. Reist im Winter ueber den kaum offenen Pass an, um den Brand von 1919 zu recherchieren. | Innerer Konflikt: Hass auf den Vater vs. Sehnsucht nach dessen Anerkennung. Furcht, selbst so kalt zu werden wie er. | Entwicklung: Anklaeger von aussen (K4) -> widerwilliger Verbuendeter Elises (K6) -> Konfrontation mit dem Vater (K8).
  - Marlene Strup | Alter: 45 | Rolle: Oberschwester / Gatekeeper | Aussehen: Grauhaarig, straff, Narbe auf dem RECHTEN Handruecken. Traegt einen Schluesselbund und ein ledernes Logbuch. | Beschreibung: Oberschwester, ehemalige Feldkrankenschwester aus dem Krieg. Barsch, effizient. Fuehrt ein Logbuch mit den Geheimnissen jedes Patienten. | Innerer Konflikt: Kontrolle als Schutz davor, sich je wieder hilflos zu fuehlen (wie an der Front). Insgeheim Mitwisserin von 1919. | Entwicklung: Strenge Torwaechterin (K1) -> ambivalente Mittlerin (K5) -> Verbuendete, die das Logbuch oeffnet (K8).
  - Marlene Kant | Alter: 27 | Rolle: Patientin / Spiegelfigur | Aussehen: Rotes Haar, blasse Haut, Brandnarbe am linken Unterarm. | Beschreibung: Patientin. Ueberlebende eines Hausbrands, bei dem ihre Familie starb. Survivor-Schuld, leichte Pyrophobie. | Innerer Konflikt: Glaubt faelschlich, das Feuer selbst gelegt zu haben. Sehnt sich nach Strafe statt nach Heilung. | Entwicklung: Erstarrte Schuld (Hintergrund K1-7) -> Wahrheit ueber den Brand (K9) -> erste Entlastung. Ihr Loslassen spiegelt Elises Weg.
  - Konrad Vanderhoek | Alter: 37 | Rolle: Vermisster Bruder / Progressions-Entitaet | Aussehen: Breit, dunkelblond, GRAU-GRUENE Augen (wie Elise — Geschwistermerkmal). Hinkt nach dem Unfall rechts. | Beschreibung: Elises aelterer Bruder. ZUSTAND: Kapitel 1-4 gilt er als beim Unfall ums Leben gekommen. Kapitel 5 enthuellt ein Telegramm, dass er lebt — verletzt im Dorf Greith versteckt. Kapitel 7 Wiedersehen. Er trennte sich bewusst, um Elise vor einer Wahrheit zu schuetzen. | Innerer Konflikt: Schutz der Schwester durch Luege vs. die Last, sie um sie trauern zu lassen. | Entwicklung: Abwesend/betrauert (K1-4) -> als lebend enthuellt (K5) -> Wiedersehen und Gestaendnis (K7).
  - Theodora 'Thea' Lindqvist | Alter: 19 | Rolle: Patientin / Hinweisgeberin | Aussehen: Sehr jung, hellblondes Haar, schmal, oft barfuss im Nachthemd. | Beschreibung: Schwedische Patientin mit Schlafwandeln. Geht nachts umher und 'ueberbringt Botschaften', an die sie sich am Morgen nicht erinnert. | Innerer Konflikt: Furcht, ein Gefaess fuer die Toten zu sein; Sehnsucht, einfach ein Maedchen zu sein. | Entwicklung: Unheimliches Werkzeug der Handlung (K3) -> menschlich gesehen und beschuetzt (K9).
  - Pfarrer Emmerich Lanz | Alter: 61 | Rolle: Beichtvater / moralischer Knoten | Aussehen: Klein, rundlich, abgetragener schwarzer Rock, ewig kalte Haende. | Beschreibung: Dorfpfarrer von Greith, besucht das Sanatorium. Heimlich Vossbergs Beichtvater und Mitwisser des Brandes von 1919. | Innerer Konflikt: Beichtgeheimnis vs. Gerechtigkeit. Furcht, durch Schweigen mitschuldig zu sein. | Entwicklung: Verschwiegener Zeuge (Hintergrund) -> bricht in K8 so weit, dass die Wahrheit ans Licht kann, ohne das Siegel direkt zu verletzen.
  - Hedwig Goss | Alter: 60 | Rolle: Koechin / Informationsquelle | Aussehen: Breit, rote Wangen, taub auf dem LINKEN Ohr, mehlbestaeubte Schuerze. | Beschreibung: Koechin von Belmont, Dorfklatsch-Gedaechtnis. Weiss, wer ueber den Pass kommt und geht. | Innerer Konflikt: Loyalitaet zum Haus vs. das Beduerfnis, gehoert zu werden. | Entwicklung: Komische Erleichterung und beilaeufige Informationsquelle; liefert in K7 den entscheidenden Dorf-Hinweis.
  - Valentin Roth | Alter: 23 | Rolle: Patient / latente Bedrohung | Aussehen: Hager, kurzgeschorenes Haar, zitternde Haende, oft im verschlossenen Nordraum. | Beschreibung: Kriegsveteran mit heftigen Nachtschrecken; nachts im verschlossenen Nordraum verwahrt. | Innerer Konflikt: Schuld ueber einen befolgten Befehl an der Front; Angst vor sich selbst. | Entwicklung: Bedrohliche Unruhe im Haus -> in K9 ein Moment stiller Menschlichkeit.
  - Ingrid Roth | Alter: 52 | Rolle: Mutter eines Patienten | Aussehen: Aufrecht, dunkler Reisemantel, verkrampfter Rosenkranz in der Hand. | Beschreibung: Valentins Mutter, besucht ihn woechentlich, leugnet die Schwere seines Zustands. ECHTE Familie mit Valentin Roth (kein Fehler — testet, dass die KI eine reale Verwandtschaft korrekt zusammenhaelt). | Innerer Konflikt: Mutterliebe vs. Scham; Verleugnung als letzter Schutz. | Entwicklung: Statisch; Funktion: emotionaler Kontrast und Pass-Wetter-Botin.
  - Dr. Cécile Brunner | Alter: 38 | Rolle: Verbuendete / externe Autoritaet | Aussehen: Elegant, dunkles Haar streng zurueckgebunden, Kneifer, Zuercher Akzent. | Beschreibung: Besuchende Neurologin aus Zuerich. Skeptikerin von Vossbergs Methoden, Verbuendete Vosskuhls. | Innerer Konflikt: Wissenschaftliche Strenge vs. Mitgefuehl; Furcht, als Frau im Fach nicht ernst genommen zu werden. | Entwicklung: Externe Skeptikerin -> liefert in K8 die fachliche Munition gegen Vossberg.
  - Anselm Vogt | Alter: 55 | Rolle: Hausmeister / Schluesselhueter | Aussehen: Knochig, wettergegerbt, schweigsam, traegt ALLE Schluessel des Hauses am Guertel — auch den Ostfluegelschluessel. | Beschreibung: Hausmeister von Belmont. Wortkarg, hueter aller Schluessel, auch des versiegelten Ostfluegels. | Innerer Konflikt: Hat 1919 auf Anweisung jemanden eingeschlossen; traegt es stumm mit sich. | Entwicklung: Verschlossener Schwellenhueter -> laesst in K6 (durch Greta) den Schluessel los und damit die Wahrheit zu.
  - Liesel Vogt | Alter: 16 | Rolle: Kuechenmagd / stille Beobachterin | Aussehen: Sommersprossig, flink, immer am Rand des Geschehens. | Beschreibung: Anselms Tochter, Kuechenmagd. Beobachtet alles. ECHTE Familie mit Anselm Vogt. | Innerer Konflikt: Loyalitaet zum Vater vs. das, was sie gesehen hat. | Entwicklung: Beobachterin; bestaetigt in K6 beilaeufig einen Hinweis.
  - Baron Friedrich von Aue | Alter: 70 | Rolle: Dauerpatient / Geldgeber (Distraktor) | Aussehen: Gepflegt, Seidenschal, Monokel, stets fröstelnd. | Beschreibung: Wohlhabender Dauerpatient und Geldgeber des Sanatoriums. Hypochonder, eitel. Bewusst handlungsferner Distraktor: oft im Codex, selten relevant. | Innerer Konflikt: Fuerchtet das Vergessenwerden mehr als den Tod. | Entwicklung: Statisch; Rauschquelle, um selektive Injektion zu pruefen.
  - Schwester Apollonia | Alter: 22 | Rolle: Pflegerin (Distraktor) | Aussehen: Junge Ordensschwester, blasses Gesicht unter der Haube. | Beschreibung: Junge Nonnen-Pflegerin, fromm. Liest heimlich die Briefe der Patienten. Distraktor mit kleinem Spaeteinsatz. | Innerer Konflikt: Froemmigkeit vs. Neugier; Scham ueber das heimliche Lesen. | Entwicklung: Statisch bis zu einem kleinen Gewissensmoment; vorrangig Rauschquelle.
  - Greta Sahl | Alter: 33 | Rolle: Patientin / Schluesseldiebin | Aussehen: Unruhig, Taschen voller geklauter Kleinigkeiten, fahrige Finger. | Beschreibung: Patientin mit Kleptomanie; hortet kleine Gegenstaende — darunter (unbemerkt) den Ostfluegelschluessel. | Innerer Konflikt: Sammeln als Ersatz fuer eine nie gefuehlte Sicherheit. | Entwicklung: Beilaeufige Diebin -> ihr Hort liefert in K6 ungewollt den Schluessel zur Wahrheit.
  - Willem 'Onkel Wim' Vanderhoek | Alter: 66 | Rolle: Off-Page-Entitaet (Halluzinations-Falle) | Aussehen: Nur aus Briefen bekannt; nie am Ort des Geschehens. | Beschreibung: Elises und Konrads Onkel in Antwerpen. Erscheint NUR ueber Briefe, NIE persoenlich in Belmont. Falle: prueft, ob die KI ihn faelschlich auftreten laesst. | Innerer Konflikt: Aus der Ferne: schlechtes Gewissen, die Geschwister allein gelassen zu haben. | Entwicklung: Bleibt off-page; darf nie physisch in einer Szene auftauchen.
  - Der Bote vom Pass | Alter: unbekannt | Rolle: Funktionsfigur | Aussehen: Vermummt, eisbärtig, kaum je das Gesicht zu sehen. | Beschreibung: Namenloser Postbote, der zweimal woechentlich Post ueber den Pass bringt — wetterabhaengig. Bringt in K5 das entscheidende Telegramm. | Innerer Konflikt: — | Entwicklung: Reine Funktion: Verbindung zur Aussenwelt, die das Wetter kappen kann.
  ORTE UND DINGE:
  - Haus Belmont | Art: Ort | Beschreibung: Das Sanatorium. Erbaut 1881, vier Fluegel, doch nur DREI in Gebrauch — der Ostfluegel ist versiegelt. Karbolgeruch, Messinggelaender, hohe kalte Flure.
  - Der Ostfluegel | Art: Ort | Beschreibung: INVARIANTE: seit dem Brand von 1919, bei dem ein Patient starb, VERSIEGELT und unzugaenglich — bis Elise in Kapitel 6 das Siegel bricht und eintritt. Vor K6 darf niemand hindurchgehen.
  - Der Wintergarten | Art: Ort | Beschreibung: Verglaster Wintergarten, beschlagene Scheiben, Ort der Gruppensitzungen.
  - Das Behandlungszimmer | Art: Ort | Beschreibung: Vossbergs Hypnose-Zimmer. Messing-Apparatur, schwerer Vorhang, ein einzelner Lehnstuhl.
  - Der Nordraum | Art: Ort | Beschreibung: Verschlossener Raum im Nordfluegel, in dem Valentin Roth nachts verwahrt wird.
  - Der Belmontpass | Art: Ort | Beschreibung: INVARIANTE: einzige Strasse, von November bis April zugeschneit und gesperrt. Schneidet Belmont von der Welt ab; oeffnet erst im Tauwetter (K9). Motor von Klaustrophobie und Informationskontrolle.
  - Dorf Greith | Art: Ort | Beschreibung: Bergdorf unterhalb des Sanatoriums. Dort versteckt sich Konrad; Schauplatz des Wiedersehens in K7.
  - Die Kapelle | Art: Ort | Beschreibung: Kleine Kapelle, in der Pfarrer Lanz amtiert.
  - Der zugefrorene See | Art: Ort | Beschreibung: INVARIANTE: zugefrorener See unterhalb des Ostfluegels; das Eis ist duenn und gefaehrlich. Bei Tauwetter (K9) bricht es auf.
  - Elises silbernes Medaillon | Art: Gegenstand | Beschreibung: INVARIANTE: enthaelt EINE Fotografie von ZWEI Kindern (Elise und Konrad), nicht von einer Person. Identitaets- und Erinnerungsanker.
  - Das Logbuch | Art: Gegenstand | Beschreibung: Marlene Strups ledernes Buch mit den Geheimnissen jedes Patienten. Begehrtes Objekt; wird in K8 geoeffnet.
  - Henris Schneebild | Art: Gegenstand | Beschreibung: Das immer gleiche Schneemotiv, das der stumme Patient Henri Aubœuf zwanghaft malt. Wiederkehrendes Hinweis-Objekt (zeigt verdeckt den Ostfluegel im Brand).
  - Der Ostfluegelschluessel | Art: Gegenstand | Beschreibung: Schwerer Eisenschluessel, normal an Anselm Vogts Guertel. Von Greta Sahl gestohlen, in ihrem Hort; in K6 von Elise gefunden — oeffnet den Ostfluegel.
  - Das Telegramm | Art: Gegenstand | Beschreibung: WENDEPUNKT-OBJEKT: das in K5 ueber den Pass eintreffende Telegramm, das enthuellt, dass Konrad lebt. Vor K5 existiert es in der Handlung nicht.
  - Vossbergs Stock | Art: Gegenstand | Beschreibung: Silbergriffiger Gehstock des Chefarztes; Zeichen seines Hinkens und seiner Autoritaet.
  - Die Brosche der Baronin | Art: Gegenstand | Beschreibung: Wertvolle Brosche aus dem Besitz des Barons (von Aue). Bewusster Ablenker / Red Herring; handlungsfern.
  KAPITELPLAN (alle Kapitel des Buches):
  1. Ankunft im Schnee — Elise wird halb erfroren nach Belmont gebracht; Oberschwester Marlene Strup nimmt sie auf, Chefarzt Vossberg begutachtet sie. Der Pass schliesst sich hinter ihr. Konrad gilt als tot.
  2. Das Behandlungszimmer — Vossberg schlaegt Hypnose und 'kontrolliertes Vergessen' vor; der junge Assistent Vosskuhl widerspricht leise. Elises Verleugnung verhaertet sich.
  3. Die Schlafwandlerin — Nachts uebergibt die schlafwandelnde Thea Elise eine Botschaft: Sie solle nach dem Ostfluegel fragen. Erster Riss in Elises Verleugnung; Anselm Vogt weicht aus.
  4. Der Sohn kommt an — Der Journalist Matthias Vossberg, entfremdeter Sohn des Chefarztes, reist ueber den kaum offenen Pass an, um den Brand von 1919 zu recherchieren. Vater-Sohn-Spannung; Elises Verdacht richtet sich nach aussen.
  5. Das Telegramm — WENDEPUNKT: Ein Telegramm enthuellt, dass Konrad lebt — verletzt versteckt in Greith. Elise kippt von Schock in Entschlossenheit. Marlene Strup wird zur ambivalenten Mittlerin.
  6. Der Ostfluegel — Elise findet den von Greta gestohlenen Ostfluegelschluessel, bricht das Siegel und betritt den seit 1919 verschlossenen Ostfluegel. Sie entdeckt Beweise des vertuschten Brandes. Ab hier ist der Ostfluegel zugaenglich.
  7. Greith im Schnee — Elise steigt ins Dorf hinab und sieht Konrad wieder. Er gesteht seine Schutz-Luege; Elises Erinnerung kehrt zurueck. Frau Goss lieferte den entscheidenden Hinweis.
  8. Die Beichte — Pfarrer Lanz und die Neurologin Dr. Brunner bringen die Wahrheit ueber 1919 ans Licht; Marlene Strup oeffnet das Logbuch; Vossberg zerbricht und wird entlarvt. Vosskuhl stellt sich offen gegen ihn.
  9. Tauwetter — Der Pass oeffnet sich, das Eis auf dem See bricht. Mehrere Arcs loesen sich: Marlene Kant erfaehrt die Wahrheit ueber den Brand, Thea wird menschlich gesehen, Vosskuhl uebernimmt Verantwortung. Elise waehlt bewusst, was sie erinnern will.
assertions: # judged per text by all judges; an assertion counts as violated on a majority
  - { id: b4-1, dim: confusion, rule: "TRIPEL-FALLE: Matthias Vossberg (Sohn, Journalist, graue Augen) vs. Dr. Adrian Vossberg (Vater, Chefarzt, blaue Augen) vs. Dr. Adrian Vosskuhl (nicht verwandt). Matthias und Adrian Vossberg sind Vater und Sohn; Vosskuhl gehoert NICHT zur Familie und sollte hier gar nicht hineingezogen werden." }
  - { id: b4-2, dim: selectivity, rule: "Vosskuhl ist hier Distraktor und sollte NICHT als Vossbergs Sohn oder Verwandter auftauchen." }
  - { id: b4-3, dim: consistency, rule: "Der Pass ist nur mit Muehe passierbar (Wintersperre, ausnahmsweise offen) — konsistent mit der Invariante." }
  - { id: b4-4, dim: spoiler, rule: "Konrad weiterhin als tot behandelt (letztes Kapitel vor der Enthuellung)." }
  - { id: b4-5, dim: psyche, rule: "Vossbergs Arc: erste Risse in der Autoritaet durch die Ankunft des Sohnes. Elises Arc: Verdacht wendet sich nach aussen, sie verbuendet sich innerlich mit dem Ermittler." }
  - { id: b4-6, dim: consistency, rule: "Augenfarben bleiben global stabil: Elise grau-gruen, Adrian Vossberg blau, Adrian Vosskuhl braun, Matthias Vossberg grau, Konrad grau-gruen." }
  - { id: b4-7, dim: consistency, rule: "Familien bleiben korrekt: Anselm & Liesel Vogt; Valentin & Ingrid Roth; Adrian & Matthias Vossberg sind Vater/Sohn; Vosskuhl gehoert zu keiner dieser Familien." }
