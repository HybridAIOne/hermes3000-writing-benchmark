  - Johann Sahlmann | Alter: 62 | Rolle: Patriarch Haus Sahlmann | Aussehen: Breit, kahl, kleine listige Augen, schwere goldene Uhrkette. | Beschreibung: Oberhaupt des reichen, skrupellosen Hauses Sahlmann. Spekulant. GLEICHER VORNAME wie Johann Vögel. | Innerer Konflikt: Geldgier vs. später Wunsch nach Achtung. | Entwicklung: Sein Spekulieren in der Krise bringt mehrere Häuser an den Rand.
