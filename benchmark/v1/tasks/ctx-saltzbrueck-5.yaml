  - Heinrich Dose | Alter: 60 | Rolle: Gärtner bei Haus Vögel | Aussehen: Ein gebeugter alter Mann mit knotigen Händen und einem milchig-blinden linken Auge. | Beschreibung: Er pflegt seit vierzig Jahren die Orangerie und den ummauerten Garten. Die Pflanzen sind ihm Familie, seit seine eigene fortgezogen ist. | Innerer Konflikt: Er fühlt, dass sein Alter ihn zur Last macht, und fürchtet den Tag, an dem man ihn aus seinem Gewächshaus vertreibt. | Entwicklung: Der alte Gärtner findet in der jüngsten Tochter eine Lehrling und damit einen Sinn über sich hinaus.
