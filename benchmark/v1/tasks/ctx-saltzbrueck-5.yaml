  - Wilhelm Reuter | Alter: 59 | Rolle: Patriarch Haus Reuter | Aussehen: Würdevoll, grauer Spitzbart, ruhige graue Augen, stets korrekt gekleidet. | Beschreibung: Oberhaupt des alteingesessenen, etwas verarmten Hauses Reuter. Ehrenhaft, vorsichtig. GLEICHER VORNAME wie Wilhelm Brandt — aber eine Generation älter und ganz anderen Wesens. | Innerer Konflikt: Bewahrung der Ehre vs. heimlich drückende Schulden. | Entwicklung: Sucht im Erbstreit ein Bündnis, das sein Haus rettet, ohne die Ehre zu verkaufen.
