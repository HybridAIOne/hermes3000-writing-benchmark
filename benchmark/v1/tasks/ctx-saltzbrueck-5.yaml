  - Anna Reuter | Alter: 24 | Rolle: Tochter Haus Reuter | Aussehen: ROTES Haar, sommersprossig, fromme blaue Augen, schlichte Kleidung. | Beschreibung: Still, fromm, pflichtbewusst. EINE VON DREI ANNAS — NICHT die scharfe Anna Brandt und NICHT die glänzende Anna Vögel. | Innerer Konflikt: Frömmigkeit vs. heimliche Zuneigung über die Standesgrenze. | Entwicklung: Findet im Krisenwinter zu unerwarteter Stärke.
