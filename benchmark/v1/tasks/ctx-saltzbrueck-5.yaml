  - Clara Timm | Alter: 41 | Rolle: Gouvernante bei Haus Vögel | Aussehen: Eine aufrechte Frau mit strengem Haarknoten und durchdringenden dunkelbraunen Augen hinter einer randlosen Brille. | Beschreibung: Sie erzieht die drei Töchter des Hauses Vögel in Französisch, Klavier und Sittsamkeit. Hinter der Strenge verbirgt sich eine belesene, einsame Seele. | Innerer Konflikt: Sie liebt die ihr anvertrauten Kinder wie eigene und weiß doch, dass sie eines Tages fortgeschickt wird, wenn sie nichts mehr lehren kann. | Entwicklung: Sie wagt es schließlich, gegen den Willen der Eltern für die Bildung der begabtesten Tochter einzustehen.
  - Wilhelm Bähr | Alter: 38 | Rolle: Hauslehrer bei Haus Vögel | Aussehen: Ein blasser, schlanker Mann mit tintenfleckigen Fingern und einer Locke, die ihm stets in die Stirn fällt. | Beschreibung: Ein gescheiterter Theologe, der den Söhnen des Hauses Latein und Mathematik beibringt. Er träumt von einer Professur, die ihm versagt blieb. | Innerer Konflikt: Sein Stolz auf die eigene Bildung kollidiert mit der demütigenden Abhängigkeit von einer Familie, die ihn kaum für voll nimmt. | Entwicklung: Er findet im Krisenjahr den Mut, die sichere Demütigung gegen ein ungewisses eigenes Wagnis einzutauschen.
