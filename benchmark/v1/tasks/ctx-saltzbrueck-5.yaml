prompt: |
  BUCHKONTEXT:
  {{context}}

  AUFGABE: Schreibe das fünfte Kapitel (ca. 600-800 Wörter). Friedrich Reuter durchschaut beim Führen der Kontorbücher den Wechsel über zwölftausend Mark, mit dem Johann Vögel die Brandts in die Enge treibt. Er trägt es Anna Brandt zu. Nahe dritte Person auf Anna Brandt, im definierten Stil.
context: |
  TITEL: Die Häuser von Saltzbrück
  PLOT: Saltzbrück, eine hanseatische Kaufmannsstadt, Winter 1887 bis Herbst 1888. Der Patriarch Heinrich Brandt, Oberhaupt des angesehensten Handelshauses der Stadt, stirbt zu Beginn — und hinterlässt ein umstrittenes Testament, das nicht den ältesten Sohn Friedrich, sondern überraschend eine andere Person zum Erben einsetzt. Zugleich erschüttert eine Handelskrise die fünf großen Kaufmannsdynastien (Brandt, Vögel, Reuter, Sahlmann und die niederländischen Coormans, mit denen die Brandts verschwägert sind). Heinrichs Tochter Anna Brandt, scharfsinnig und unverheiratet, versucht das Haus durch Erbstreit, faule Wechsel, geheime Teilhaberschaften und wechselnde Allianzen zwischen den Häusern zu steuern. Ein totgeglaubtes Schiff und seine Ladung, ein versiegelter Brief und der wahre Erbe treiben die Handlung. Eskalation Haus für Haus, Kapitel für Kapitel: Tod des Patriarchen, Testamentseröffnung, Krisenwinter, Allianzen, Verrat, die Rückkehr einer verloren geglaubten Ladung, Enthüllung des wahren Erben, Bruch und Neuordnung.
  STIL: Literarisch, nahe dritte Person auf Anna Brandt, im Ton von Thomas Manns Buddenbrooks: bürgerlich-hanseatisch, ironisch-distanziert, mit Sinn für Geld, Stand und Verfall. Sensorische Stadt- und Kontorbilder (Speichergeruch, Wachssiegel, Schnee auf der Trave, Kontorbücher). Gehobenes literarisches Deutsch, knappe unterkühlte Dialoge, keine Genre-Klischees, Andeutung statt Aussprache. Keine Kapitelüberschriften im Text.
  FIGUREN:
