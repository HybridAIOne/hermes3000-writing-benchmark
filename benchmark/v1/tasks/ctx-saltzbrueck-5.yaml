  - Heinrich Vögel | Alter: 64 | Rolle: Patriarch Haus Vögel, Rivale | Aussehen: Massig, BRAUNE Augen, hochrotes cholerisches Gesicht, mächtiger Backenbart. | Beschreibung: Oberhaupt des aufstrebenden Konkurrenzhauses Vögel. Laut, jovial, berechnend. GLEICHER VORNAME wie Heinrich Brandt — aber das genaue Gegenteil im Wesen. | Innerer Konflikt: Gier nach gesellschaftlichem Rang vs. das Wissen, ein Emporkömmling zu sein. | Entwicklung: Wittert im Erbstreit der Brandts die Chance, sie zu überflügeln.
  - Marie Vögel | Alter: 58 | Rolle: Gattin des Vögel-Patriarchen | Aussehen: Üppig gekleidet, kühle helle Augen, Vorliebe für auffälligen Schmuck. | Beschreibung: Ehrgeizige Hausherrin, die auf gesellschaftlichen Aufstieg drängt. NICHT zu verwechseln mit Marie Sahlmann. | Innerer Konflikt: Standesdünkel vs. Herkunftsscham. | Entwicklung: Treibt die Verlobungspläne ihrer Kinder als Machtinstrument.
