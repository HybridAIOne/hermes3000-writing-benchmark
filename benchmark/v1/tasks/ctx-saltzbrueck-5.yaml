  - Johann Carstens | Alter: 44 | Rolle: Kammerdiener bei Haus Reuter | Aussehen: Ein eleganter Mann mit gepflegtem Schnurrbart und einer kaum merklichen Lähmung des rechten Beins. | Beschreibung: Er führt den Haushalt der Reuters mit diplomatischem Geschick und kennt jeden Gläubiger, der an die Tür klopft. Sein Humpeln stammt aus einem Sturz, über den er nie spricht. | Innerer Konflikt: Er verheimlicht der Herrschaft das wahre Ausmaß der Schulden und fragt sich, ob er sie schützt oder betrügt. | Entwicklung: Der vertrauenswürdige Diener gerät an die Grenze, wo Loyalität in Komplizenschaft umschlägt.
  - Lene Petersen | Alter: 31 | Rolle: Köchin bei Haus Reuter | Aussehen: Eine rundliche Frau mit mehligen Armen und einem warmen, zahnlückigen Lächeln. | Beschreibung: Sie kocht sparsam und doch schmackhaft, was in Zeiten der Handelskrise eine Kunst ist. Die Dienstboten lieben sie wie eine Mutter. | Innerer Konflikt: Sie streckt das Wirtschaftsgeld heimlich, um die hungernden Kinder ihrer Schwester zu speisen, und fürchtet die Entdeckung des kleinen Betrugs. | Entwicklung: Aus der heimlichen Mildtätigen wird eine, die offen für die Ärmsten der Stadt einsteht.
  - Wilhelm Hagedorn | Alter: 29 | Rolle: Kutscher bei Haus Reuter | Aussehen: Ein hochgewachsener junger Mann mit kohlschwarzem Haar und einer feinen Narbe, die seine rechte Augenbraue teilt. | Beschreibung: Jünger als die meisten Kutscher und ehrgeiziger, träumt er davon, einst ein eigenes Fuhrgeschäft zu führen. Er fährt schnell und mit Verwegenheit. | Innerer Konflikt: Sein Aufstiegswille treibt ihn dazu, sich in Geschäfte einzumischen, die einem Dienstboten nicht zustehen. | Entwicklung: Der ehrgeizige Kutscher lernt, dass der Weg nach oben nicht über den Verrat seiner Mitdiener führt.
  - Anna Knaack | Alter: 36 | Rolle: Beschließerin (Wirtschafterin) bei Haus Sahlmann | Aussehen: Eine hagere Frau mit scharfen Zügen und einem klimpernden Schlüsselbund an der schmalen Hüfte. | Beschreibung: Sie verwaltet Vorräte, Silber und Gesinde des Hauses Sahlmann mit der Genauigkeit eines Buchhalters. Nichts entgeht ihrem prüfenden Blick. | Innerer Konflikt: Sie hat sich zur Herrin der Schlüssel emporgedient und fürchtet jede jüngere Magd, die ihren Platz bedrohen könnte. | Entwicklung: Die misstrauische Beschließerin lernt, eine Nachfolgerin nicht als Feindin, sondern als Erbin ihres Wissens zu sehen.
  - Heinrich Timm | Alter: 55 | Rolle: Gärtner und Hausmeister bei Haus Sahlmann | Aussehen: Ein bärenhafter Mann mit gewaltigen Pranken und einem fehlenden Zeigefinger an der linken Hand. | Beschreibung: Er hält das alte Patrizierhaus und seinen verwilderten Garten in Schuss, flickt Dächer und stutzt Hecken. Den Finger verlor er an einer Säge in jungen Jahren. | Innerer Konflikt: Er ahnt, dass das verfallende Haus über seine Kräfte geht, und schämt sich, um Hilfe zu bitten. | Entwicklung: Der stolze Einzelkämpfer öffnet sich endlich der Zusammenarbeit, um das Haus vor dem Verfall zu retten.
  - Clara Dose | Alter: 21 | Rolle: Stubenmädchen bei Haus Sahlmann | Aussehen: Ein blasses Mädchen mit aschblondem Haar und einem dunklen Muttermal über der Oberlippe. | Beschreibung: Sie staubt die endlosen Salons, in denen kaum noch Gäste verkehren, und spürt die Schwermut des verarmenden Hauses. Still und sorgfältig in allem, was sie tut. | Innerer Konflikt: Sie weiß, dass der Lohn ausbleibt, und ringt mit der Versuchung, ein vergessenes Schmuckstück verschwinden zu lassen. | Entwicklung: Das ehrliche Mädchen besteht eine Prüfung der Versuchung und findet darin unerwartete Stärke.
  - Marie Carstens | Alter: 48 | Rolle: Köchin bei Haus Coorman | Aussehen: Eine stämmige Frau mit mehlbestäubter Schürze und einem auffälligen, von einem Topf verbrühten roten Fleck am Hals. | Beschreibung: Sie bringt niederländische Gerichte auf den Tisch der émigrierten Coormans und hält damit ein Stück verlorener Heimat lebendig. Resolut und stolz auf ihre fremden Rezepte. | Innerer Konflikt: Sie fühlt sich als Fremde unter dem hanseatischen Gesinde und schwankt zwischen Anpassung und Treue zu ihrer Herkunft. | Entwicklung: Die fremdelnde Köchin findet einen Weg, ihre niederländische Küche zur Brücke zwischen den Welten zu machen.
  - Wilhelm Lütt | Alter: 33 | Rolle: Kammerdiener bei Haus Coorman | Aussehen: Ein schmaler Mann mit hellblondem, streng gescheiteltem Haar und einer steifen Haltung, die einen alten Rückenschaden verrät. | Beschreibung: Er dient den Coormans seit ihrer Ankunft in Saltzbrück und vermittelt zwischen der niederländischen Herrschaft und der hanseatischen Stadt. Diskret und sprachgewandt. | Innerer Konflikt: Er ist den Coormans treu ergeben, wird aber von alteingesessenen Häusern bedrängt, ihre Geschäftsgeheimnisse zu verraten. | Entwicklung: Der loyale Diener muss zwischen verlockendem Verrat und schwerer Treue endgültig wählen.
  - Lene Stoll | Alter: 25 | Rolle: Gouvernante bei Haus Coorman | Aussehen: Eine sanfte junge Frau mit haselnussbraunen Augen und einer kleinen Hasenscharte, die ihr Sprechen leicht verschattet. | Beschreibung: Sie unterrichtet die beiden Coorman-Kinder in Deutsch und Niederländisch und hilft ihnen, sich in der fremden Stadt zurechtzufinden. Geduldig trotz mancher Spötteleien über ihre Aussprache. | Innerer Konflikt: Ihr stilles Leiden an dem körperlichen Makel hält sie davon ab, das Glück anzunehmen, das sich ihr behutsam anbietet. | Entwicklung: Sie überwindet die Scham über ihr Aussehen und wagt es, geliebt zu werden.
  - Heinrich Tiedemann | Alter: 54 | Rolle: Kapitän der Bark „Norderney“, im Frachtdienst für Haus Brandt | Aussehen: Ein wettergegerbter Mann mit einer tief eingebrannten Falte zwischen den Brauen, die ihm den Anschein dauernden Mißmuts verleiht. | Beschreibung: Tiedemann fährt seit zwei Jahrzehnten Getreide und Stückgut für das Haus Brandt über die Ostsee und gilt am Kai als der zuverlässigste, wenn auch wortkargste Schiffsführer Saltzbrücks. Die Handelskrise hat seine letzten drei Reisen unrentabel gemacht, was er den Brandts nicht zu sagen wagt. | Innerer Konflikt: Er ahnt, daß Haus Brandt ihn bald ausmustern wird, und fürchtet, ohne sein Schiff nichts mehr zu sein. | Entwicklung: Vom stummen Befehlsempfänger der Brandts wird er zu dem Mann, der ihre faulen Frachtpapiere durchschaut und zur Sprache bringt.
  - Johann Boldt | Alter: 47 | Rolle: Reeder, Eigner dreier Segler im Saltzbrücker Hafen | Aussehen: Ein behäbiger Herr im zu engen Gehrock, dessen rechte Hand stets eine schwere goldene Uhrkette durch die Finger gleiten läßt. | Beschreibung: Boldt besitzt die kleine Reederei, deren Schiffe den Häusern Brandt und Coorman ihre Waren über See bringen, und balanciert seine Loyalitäten je nach Frachtlage. Mit dem Niedergang des Handels gerät auch sein Vermögen ins Wanken. | Innerer Konflikt: Sein Stolz auf die eigene Flotte ringt mit der wachsenden Erkenntnis, daß er nur noch von der Gnade der Kaufmannshäuser lebt. | Entwicklung: Er wandelt sich vom abwartenden Geschäftsmann zum Verbündeten derer, die das Erbe der Coormans anfechten.
  - Wilhelm Greve | Alter: 39 | Rolle: Steuermann auf der „Norderney“ | Aussehen: Ein hochgewachsener Mann mit einem auffallend hellen, fast weißblonden Backenbart, der ihn älter wirken läßt, als er ist. | Beschreibung: Greve dient als erster Steuermann unter Kapitän Tiedemann und kennt jede Untiefe der Saltzbrücker Bucht. Er hofft im Stillen, eines Tages selbst ein Kommando zu führen. | Innerer Konflikt: Seine Ergebenheit gegenüber dem alternden Tiedemann steht gegen den Ehrgeiz, dessen Posten endlich zu übernehmen. | Entwicklung: Er muß lernen, daß ein Kommando nicht durch Verdrängung des Alten, sondern durch Verantwortung gewonnen wird.
  - Claas Jansen | Alter: 62 | Rolle: Hafenmeister von Saltzbrück | Aussehen: Ein knochiger Greis mit einem hölzernen Bein, das bei jedem Schritt über die Kaipflaster hallt. | Beschreibung: Jansen verwaltet seit dreißig Jahren die Liegeplätze, Zollformalitäten und Streitigkeiten am Saltzbrücker Hafen und kennt die Geheimnisse jeder Schiffsladung. Seine Bücher gelten als das verläßlichste Gedächtnis der Stadt. | Innerer Konflikt: Er weiß um manch dunkles Geschäft am Kai, schweigt jedoch aus Furcht, seine Pension und seinen Frieden zu verlieren. | Entwicklung: Aus dem schweigenden Verwalter wird der Zeuge, dessen Aufzeichnungen den Erbschaftsstreit entscheiden.
  - Detlev Albers | Alter: 44 | Rolle: Kapitän des Schoners „Möwe“, in Diensten des Hauses Coorman | Aussehen: Ein gedrungener Mann mit einer breiten Narbe quer über dem linken Handrücken, die er bei jedem Handschlag zu verbergen sucht. | Beschreibung: Albers befährt für das Haus Coorman die englischen Häfen und bringt deren feinste Kolonialwaren nach Saltzbrück. Die Coormans schulden ihm seit zwei Reisen den Heuerlohn, doch er fährt weiter, aus Furcht und aus Berechnung. | Innerer Konflikt: Er verachtet die hochmütigen Coormans und ist ihnen doch durch ausstehenden Sold ausgeliefert. | Entwicklung: Er entwickelt sich vom geduckten Schuldner zum Mann, der seine Mitwisserschaft an Coormans Geschäften als Waffe begreift.
  - Marten Storm | Alter: 29 | Rolle: Schmuggler, fährt Branntwein und Tabak an der Zollwache vorbei | Aussehen: Ein hagerer Bursche mit ruhelosen, beinahe schwarzen Augen und einem silbernen Ohrring, der im Hafenlicht aufblitzt. | Beschreibung: Storm bringt in mondlosen Nächten unverzollte Ware in die Lagerkeller der Stadt und arbeitet dabei für jeden, der zahlt. Sein Name wird am Kai nur hinter vorgehaltener Hand genannt. | Innerer Konflikt: Er sehnt sich nach einem ehrlichen Auskommen, fürchtet aber, daß ihn die Schatten seiner Geschäfte nie freigeben werden. | Entwicklung: Vom käuflichen Gesetzlosen wird er zu dem, der zwischen den Kaufmannshäusern eine fatale Wahl treffen muß.
  - Friedrich Paulsen | Alter: 51 | Rolle: Segelmacher mit Werkstatt am Alten Bollwerk | Aussehen: Ein breitschultriger Mann, dessen Hände von der Segelnaht so vernarbt sind, daß die Fingerkuppen keine Linien mehr tragen. | Beschreibung: Paulsen näht und flickt die Segel der halben Saltzbrücker Flotte und hört in seiner offenen Werkstatt jedes Gerücht des Hafens. Sein Wort gilt unter den Seeleuten mehr als das mancher Pastoren. | Innerer Konflikt: Er trauert dem Zeitalter der Segler nach und bangt um seinen Beruf, da die ersten Dampfer die Bucht befahren. | Entwicklung: Er findet seine Rolle neu als Hüter des seemännischen Gewissens, der zwischen Alt und Neu vermittelt.
  - Hauke Ohlsen | Alter: 58 | Rolle: Lotse der Saltzbrücker Bucht | Aussehen: Ein verschlossener Alter mit einem milchig erblindeten rechten Auge, das er stets leeseits zur Untiefe wendet. | Beschreibung: Ohlsen führt die Schiffe durch die tückischen Sandbänke vor Saltzbrück und kennt die Fahrrinne besser als das Vaterunser. Kein Schiff von Rang läuft ohne ihn ein oder aus. | Innerer Konflikt: Sein nachlassendes Augenlicht ringt mit dem Stolz, der ihn schweigen läßt, ehe er es eingesteht. | Entwicklung: Er muß sich entscheiden, ob er seinen Posten rechtzeitig abgibt oder ein Schiff in die Untiefe führt.
  - Jürgen Rahlf | Alter: 36 | Rolle: Zollbeamter am Kai von Saltzbrück | Aussehen: Ein peinlich gekleideter Mann mit einem stets frisch gewichsten Schnurrbart und tintenfleckigen Manschetten. | Beschreibung: Rahlf prüft Frachtbriefe und Ladungen am Hafentor und nimmt seine Pflicht ernster, als es den Kaufmannshäusern lieb ist. Sein karges Gehalt macht ihn jedoch anfällig für die richtige Summe zur rechten Zeit. | Innerer Konflikt: Seine Beamtenehre kämpft mit der Versuchung, für ein Schweigen Storms Geld anzunehmen. | Entwicklung: Er wird vom korrumpierbaren Schreiber zu dem, der einen Schmuggel aufdeckt, der bis in die Häuser reicht.
  - Lorenz Tiedemann | Alter: 23 | Rolle: Zweiter Steuermann auf der „Möwe“, Neffe des Kapitäns Tiedemann | Aussehen: Ein schmaler Jüngling mit demselben tiefen Brauenstrich wie sein Onkel, doch noch ohne dessen Härte. | Beschreibung: Lorenz dient auf Albers' Schoner und versucht, sich aus dem Schatten seines berühmten Onkels herauszuarbeiten. Zwischen den Häusern Brandt und Coorman fühlt er die Loyalitäten der Familie unangenehm zerrissen. | Innerer Konflikt: Er möchte sich vom Namen Tiedemann emanzipieren und braucht ihn doch, um überhaupt eine Heuer zu finden. | Entwicklung: Er reift vom unsicheren Neffen zum Mann, der zwischen Onkel und Reeder vermitteln muß.
  - Boye Greve | Alter: 31 | Rolle: Bootsmann auf der Bark „Norderney“ | Aussehen: Ein stämmiger Kerl mit einer rauhen Baßstimme und einem fehlenden Schneidezahn, der ihm beim Lachen ein verwegenes Aussehen gibt. | Beschreibung: Boye Greve hält als Bootsmann die Mannschaft der „Norderney“ in Zucht und ist der Bruder des Steuermanns Wilhelm. Seine Faust ist gefürchtet, sein Wort unter den Matrosen jedoch Gesetz. | Innerer Konflikt: Seine Treue zur Mannschaft gerät in Widerstreit mit der Treue zu seinem ehrgeizigen Bruder. | Entwicklung: Er lernt, daß rohe Stärke ohne Gerechtigkeit den Respekt der Mannschaft verspielt.
  - Asmus Boldt | Alter: 26 | Rolle: Matrose auf der „Möwe“, entfernter Vetter des Reeders Boldt | Aussehen: Ein sehniger Bursche mit sonnenverbranntem Nacken und einer eintätowierten Ankerschlinge am Unterarm. | Beschreibung: Asmus fährt als einfacher Matrose unter Kapitän Albers, obwohl ihn die Verwandtschaft zum Reeder Boldt zu Höherem berechtigen könnte. Er bewahrt seinen Stolz, indem er keine Vergünstigung annimmt. | Innerer Konflikt: Sein Familienstolz hadert mit der Demütigung, vor reicheren Vettern als gemeiner Mann zu dienen. | Entwicklung: Er muß entscheiden, ob er die Gunst des Vetters annimmt oder seinen eigenen Weg durch die See sucht.
  - Thies Albers | Alter: 15 | Rolle: Schiffsjunge auf der „Norderney“ | Aussehen: Ein magerer Knabe mit abstehenden Ohren und einer dauerhaft aufgeschürften Kniescheibe vom Klettern in der Takelage. | Beschreibung: Thies ging mit dreizehn zur See, um seine verwitwete Mutter zu ernähren, und schuftet nun unter Kapitän Tiedemann. Seine Neugier treibt ihn an Orte des Schiffes, wo ein Junge nichts zu suchen hat. | Innerer Konflikt: Sein kindlicher Wunsch nach Heimat und Mutter steht gegen die Sehnsucht, ein richtiger Seemann zu werden. | Entwicklung: Er wächst vom belächelten Schiffsjungen zum Zeugen eines Geheimnisses, das er zu jung ist zu tragen.
  - Reimer Storm | Alter: 49 | Rolle: Kapitän der „Albatros“, auf eigene Rechnung im Küstenhandel | Aussehen: Ein hochgewachsener Mann mit einem ergrauten Vollbart und einer Seekarte, die er auch an Land stets unter dem Arm trägt. | Beschreibung: Reimer Storm fährt als einer der wenigen unabhängigen Kapitäne und nimmt Fracht, wo immer sie sich findet, ohne einem Hause verpflichtet zu sein. Den Schmuggler Marten Storm, seinen jüngeren Bruder, verleugnet er in aller Öffentlichkeit. | Innerer Konflikt: Seine mühsam bewahrte Ehrbarkeit ist bedroht durch das Blut, das ihn an den Schmuggler bindet. | Entwicklung: Er muß sich zwischen der Reinheit seines Namens und der Rettung seines Bruders entscheiden.
  - Momme Paulsen | Alter: 41 | Rolle: Steuermann auf der „Albatros“ | Aussehen: Ein wortkarger Mann mit einer schiefen Schulter von einem alten Mastbruch und einem ruhigen, prüfenden Blick. | Beschreibung: Momme dient als Steuermann unter Reimer Storm und ist der Sohn des Segelmachers Friedrich Paulsen. Er gilt als der besonnenste Navigator der Küste und mißtraut allem, was die Kaufmannshäuser an Aufträgen verteilen. | Innerer Konflikt: Sein Mißtrauen gegen die Mächtigen ringt mit der Notwendigkeit, deren Fracht annehmen zu müssen. | Entwicklung: Er findet aus der Vorsicht heraus den Mut, sich offen gegen ein unredliches Geschäft zu stellen.
  - Antje Rahlf | Alter: 38 | Rolle: Wirtin der Hafenschenke „Zum Anker“, Schwester des Zollbeamten | Aussehen: Eine resolute Frau mit roten, vom Spülwasser geröteten Händen und einem Schlüsselbund, der bei jedem Schritt an ihrer Hüfte klimpert. | Beschreibung: Antje führt die Schenke am Kai, in der Kapitäne, Lotsen und Schmuggler unter einem Dach trinken, und hört dabei mehr, als ihr lieb ist. Als Schwester des Zollbeamten Rahlf sitzt sie zwischen allen Stühlen des Hafens. | Innerer Konflikt: Ihre Verschwiegenheit als Wirtin steht gegen die Sorge um den Bruder, den sie in ein gefährliches Schweigen verstrickt sieht. | Entwicklung: Aus der neutralen Wirtin wird die Frau, deren Aussage den Schmuggel und die Erbschaft miteinander verknüpft.
  - Friedrich Kröger | Alter: 61 | Rolle: Bürgermeister von Saltzbrück | Aussehen: Hochgewachsen und schwerfällig, mit einem in der Mitte sorgfältig geteilten weißen Backenbart, der ihm das Ansehen eines Senatsporträts verleiht. | Beschreibung: Ein Mann des Ausgleichs, der seit zwanzig Jahren die Geschicke der Stadt mit ruhiger Hand lenkt. In der Handelskrise sieht er die größte Prüfung seiner Amtszeit. | Innerer Konflikt: Er weiß, dass das Wohl der Stadt ein hartes Eingreifen verlangt, doch jede Maßnahme kränkt eines der alten Häuser, denen er Freundschaft schuldet. | Entwicklung: Vom väterlich-vermittelnden Patriarchen wird er zu einem Mann, der erkennen muss, dass Neutralität in der Krise selbst eine Parteinahme ist.
  - Hinrich Lembke | Alter: 54 | Rolle: Senator, Finanzressort | Aussehen: Schmal und aufrecht, mit kalten grauen Augen hinter einem randlosen Kneifer, der bei jeder Erregung von der Nase rutscht. | Beschreibung: Der strengste Rechner im Senat, der die leeren Stadtkassen verwaltet wie sein eigenes Hauptbuch. Er traut keiner Bilanz, die er nicht selbst geprüft hat. | Innerer Konflikt: Seine Pflicht zur Sparsamkeit kämpft gegen die heimliche Furcht, dass sein eigenes Vermögen an die strauchelnden Häuser gebunden ist. | Entwicklung: Der unbestechliche Kämmerer gerät in den Verdacht, die Krise zum eigenen Vorteil zu lenken, und muss seine Rechtschaffenheit verteidigen.
  - Marie Hagen | Alter: 47 | Rolle: Senatorin-Witwe, Armenpflege-Ressort | Aussehen: In dauernder Halbtrauer gekleidet, trägt sie an der Kehle eine schwarze Gemmenbrosche, die sie bei jeder schweren Entscheidung umfasst. | Beschreibung: Als Witwe eines Senators führt sie dessen Mandat in der Armenpflege weiter und gilt als das soziale Gewissen des Rates. Die wachsende Not der kleinen Leute ist ihr tägliches Geschäft. | Innerer Konflikt: Sie will den Verarmten helfen, fürchtet aber, dass jede Mildtätigkeit die Stadt vollends in den Ruin treibt. | Entwicklung: Aus der stillen Verwalterin der Armut wird eine offene Mahnerin, die dem Senat die menschlichen Kosten der Sparpolitik vor Augen führt.
  - Cornelius Suhr | Alter: 58 | Rolle: Senator, Hafen- und Handelsressort | Aussehen: Rotgesichtig und breitschultrig, mit einer goldenen Uhrkette quer über dem gewölbten Bauch, an der ein winziger Anker baumelt. | Beschreibung: Ein alter Reeder, der das Ressort für Hafen und Handel führt und jeden Kapitän beim Vornamen kennt. Sein Herz hängt am Kai und an den auslaufenden Schiffen. | Innerer Konflikt: Er soll im Senat unparteiisch entscheiden, während sein eigenes Reedereigeschäft von denselben Frachtverträgen abhängt. | Entwicklung: Der joviale Hafenmann muss lernen, dass seine Verbindungen zu den Kaufmannshäusern ihn erpressbar gemacht haben.
  - Theodor Mommsen | Alter: 52 | Rolle: Pastor von St. Marien | Aussehen: Hager und blass, mit langen, geäderten Händen, die er beim Predigen wie zur Beschwörung über die Gemeinde ausbreitet. | Beschreibung: Der Hauptpastor der Stadt, ein gelehrter und strenger Mann der alten lutherischen Schule. Von der Kanzel herab geißelt er den Mammon, der die Kaufmannsstadt regiert. | Innerer Konflikt: Er verkündet die Gleichheit vor Gott, ist aber selbst auf die Stiftungen ebenjener reichen Häuser angewiesen, deren Hochmut er anprangert. | Entwicklung: Der unnahbare Mahner wird durch das Elend der Krise gezwungen, vom strafenden zum tröstenden Seelsorger zu werden.
  - Clara Voss | Alter: 29 | Rolle: Kaplanin und Vikarin an St. Marien | Aussehen: Eine junge Frau von ernster Schönheit, mit einer auffälligen weißen Strähne im dunklen, streng gescheitelten Haar. | Beschreibung: Eine der ersten Frauen im geistlichen Dienst der Stadt, die dem alten Pastor Mommsen zuarbeitet und die Armenviertel betreut. Ihr unkonventioneller Glaube weckt Misstrauen und Bewunderung zugleich. | Innerer Konflikt: Ihr Drang, den Ärmsten praktisch zu helfen, stößt ständig an die Gehorsamspflicht gegenüber einer Kirche, die das Bestehende heiligt. | Entwicklung: Von der geduldeten Gehilfin wächst sie zur eigenständigen geistlichen Stimme der kleinen Leute heran.
  - Gottfried Drews | Alter: 63 | Rolle: Zunftmeister der Kaufmannschaft | Aussehen: Untersetzt und würdevoll, trägt er stets den schweren silbernen Amtsring der Zunft am Daumen, den er beim Sprechen gedankenverloren dreht. | Beschreibung: Das gewählte Oberhaupt der Kaufmannschaft, ein Mann von eisernen Grundsätzen und altem Korpsgeist. Er wacht über die ungeschriebenen Gesetze des hanseatischen Handels. | Innerer Konflikt: Die Treue zur Zunft und ihren überkommenen Regeln gerät in Widerstreit mit der Einsicht, dass nur ein Bruch mit der Tradition die Häuser noch retten kann. | Entwicklung: Der Hüter der alten Ordnung muss erleben, wie seine Zunft an der neuen Zeit zerbricht, und sucht einen würdigen Weg des Übergangs.
  - Reimer Wulf | Alter: 49 | Rolle: Notar und Stadtschreiber | Aussehen: Ein gebeugter Mann mit tintenfleckigen Fingern und einer grünen Augenklappe, die ein im Aktenstaub erblindetes Auge verbirgt. | Beschreibung: Der Notar, durch dessen Hände jeder Vertrag, jedes Testament und jede Erbschaft der Stadt geht. Er kennt die wahren Verhältnisse der Häuser besser als deren eigene Söhne. | Innerer Konflikt: Sein Berufseid zur Verschwiegenheit lastet schwer, seit er weiß, dass das umstrittene Testament eine Lüge birgt. | Entwicklung: Der diskrete Aktenmensch wird wider Willen zur Schlüsselfigur im Erbschaftsstreit, dessen Geheimnis er hütet oder preisgibt.
  - Augustin Harms | Alter: 57 | Rolle: Stadtarzt | Aussehen: Stämmig und kahlköpfig, mit einem mächtigen, nach unten gezwirbelten Schnauzbart, der nach Karbol und Tabak riecht. | Beschreibung: Der Physikus der Stadt, der vom Patrizierschlafzimmer bis ins Armenhaus jeden Kranken besucht. In der nasskalten Krisenwinter grassieren Fieber und Schwindsucht. | Innerer Konflikt: Als Arzt kennt er die Schwächen und Süchte der Mächtigen, muss aber zwischen ärztlichem Schweigen und der Sorge um die Stadt entscheiden. | Entwicklung: Der nüchterne Heiler erkennt, dass die wahre Krankheit der Stadt nicht im Körper, sondern in ihren Verhältnissen liegt, und beginnt sich einzumischen.
  - Jakob Detlefsen | Alter: 44 | Rolle: Apotheker zur Goldenen Waage | Aussehen: Bleich und fahrig, mit gelblich verfärbten Fingerkuppen vom ewigen Hantieren mit Tinkturen und Säuren. | Beschreibung: Der Apotheker am Markt, dessen Offizin zugleich Umschlagplatz für Klatsch und Gerüchte der ganzen Stadt ist. Wer ein Mittel braucht, ob gegen Husten oder Sorgen, kommt zu ihm. | Innerer Konflikt: Sein Wissen um die heimlichen Leiden der feinen Familien verleiht ihm Macht, die ihn ebenso lockt wie ängstigt. | Entwicklung: Vom harmlosen Klatschmaul wird er zum Mitwisser gefährlicher Geheimnisse, das ihn in die Intrigen der Häuser zieht.
  - Wilhelm Mommsen | Alter: 33 | Rolle: Journalist des Saltzbrücker Boten | Aussehen: Ein hagerer junger Mann mit nervös zuckendem Lid und einem stets schief sitzenden Stehkragen, den er nie zu bändigen vermag. | Beschreibung: Der Neffe des Pastors, der für das Lokalblatt schreibt und eine Witterung für Skandale besitzt. Er träumt von einer großen Geschichte, die seinen Namen über die Stadt hinausträgt. | Innerer Konflikt: Seine Gier nach der enthüllenden Wahrheit ringt mit den Familienrücksichten und der Furcht, mächtige Inserenten zu verlieren. | Entwicklung: Der ehrgeizige Schreiber muss wählen zwischen einer bequemen Karriere und der gefährlichen Aufdeckung des Erbschaftsbetrugs.
  - Berthold Kröger | Alter: 46 | Rolle: Polizeikommissar | Aussehen: Breit und schweigsam, mit einer wulstigen Narbe über der linken Augenbraue, die ihm einen dauernd misstrauischen Ausdruck gibt. | Beschreibung: Ein entfernter Vetter des Bürgermeisters, der über Ruhe und Ordnung in der Stadt wacht. Hinter seiner schwerfälligen Art verbirgt sich ein scharfer, beobachtender Verstand. | Innerer Konflikt: Die Verwandtschaft zum Bürgermeister verpflichtet ihn zur Loyalität, während seine Ermittlungen ihn ins Zentrum der Macht führen. | Entwicklung: Der pflichttreue Ordnungshüter gerät in den Zwiespalt, ob er einen Verdacht gegen die eigenen Gönner verfolgen darf.
  - Magnus Suhr | Alter: 59 | Rolle: Richter am Stadtgericht | Aussehen: Eine imposante Erscheinung mit eisgrauem Löwenhaupt und einer tiefen, sonoren Stimme, die im Gerichtssaal jeden verstummen lässt. | Beschreibung: Der angesehenste Richter der Stadt, dem die Entscheidung im Erbschaftsstreit der Häuser zufallen wird. Er gilt als unbeugsam und der reinen Lehre des Rechts ergeben. | Innerer Konflikt: Sein Glaube an die Unparteilichkeit des Gesetzes wankt, als er erkennt, wie sehr Standesinteressen den Gang der Gerechtigkeit lenken. | Entwicklung: Der vermeintlich unbestechliche Richter muss sich entscheiden, ob er dem Buchstaben des Gesetzes oder einer höheren Gerechtigkeit folgt.
  - Eduard Voss | Alter: 41 | Rolle: Senator, Bauressort | Aussehen: Geschniegelt und stutzerhaft gekleidet, trägt er an der kleinen Hand einen auffälligen Siegelring mit einem blutroten Karneol. | Beschreibung: Der jüngste Senator, ehrgeizig und dem Fortschritt zugewandt, der die Modernisierung von Hafen und Speichervierteln vorantreibt. Sein rascher Aufstieg weckt Neid im Rat. | Innerer Konflikt: Sein Drang nach Erneuerung der Stadt verquickt sich gefährlich mit dem eigenen Streben nach Macht und Vermögen. | Entwicklung: Der schillernde Aufsteiger gerät unter Verdacht, die Krise für rücksichtslose Spekulationen zu nutzen, und kämpft um seinen Ruf.
  - Eberhard Hellwig | Alter: 55 | Rolle: Bankier aus Berlin | Aussehen: Glatt rasiert und großstädtisch elegant, mit einem schweren Brillantring, den er beim Verhandeln blitzen lässt wie eine Drohung. | Beschreibung: Ein Vertreter eines Berliner Bankhauses, der in die Stadt kommt, um über die Schulden der strauchelnden Häuser zu verhandeln. Sein höfliches Lächeln verbirgt eine eiserne Kalkulation. | Innerer Konflikt: Er soll für seine Bank das Letzte herauspressen, spürt aber eine ungewohnte Achtung vor der Würde der untergehenden Häuser. | Entwicklung: Der kalte Geldmann des neuen Reichs wird zur Schicksalsfigur, die über Rettung oder Untergang der alten Hanse entscheidet.
  - Charles Ashworth | Alter: 48 | Rolle: Englischer Käufer und Handelspartner | Aussehen: Hochgewachsen und sonnengebräunt, mit rotblondem Backenbart und einem stets frischen weißen Nelkensträußchen im Knopfloch. | Beschreibung: Ein Kaufmann aus Hull, der die Notlage der Stadt nutzt, um Speicher und Frachtverträge günstig zu erwerben. Höflich und undurchschaubar, spricht er ein gewähltes, akzentgefärbtes Deutsch. | Innerer Konflikt: Sein geschäftlicher Vorteil verlangt die Ausnutzung der Krise, doch eine wachsende Zuneigung zur Stadt und einer ihrer Töchter durchkreuzt seine Pläne. | Entwicklung: Vom kühlen Aufkäufer wandelt er sich zu einem Mann, der zwischen dem Profit der Heimat und einer neuen Bindung steht.
  - Detlev Hagen | Alter: 50 | Rolle: Hamburger Konkurrent und Reeder | Aussehen: Massig und dröhnend, mit einem feuerroten Vollbart und einer zerkauten Zigarre, die nie aus dem Mundwinkel weicht. | Beschreibung: Ein erfolgreicher Hamburger Reeder, ein entfernter Verwandter der Saltzbrücker Hagens, der die kleinere Schwesterstadt am liebsten ganz verschlingen würde. Sein Hohn auf die provinzielle Hanse ist beißend. | Innerer Konflikt: Hinter seiner Verachtung für die kleine Stadt verbirgt sich der heimliche Neid auf eine Würde, die seinem eigenen Aufstieg fehlt. | Entwicklung: Der polternde Konkurrent muss erkennen, dass sein Triumph über die schwächere Stadt ihn selbst seiner Wurzeln beraubt.
  - Igor Wolkow | Alter: 53 | Rolle: Russischer Getreidehändler | Aussehen: Bärenhaft und pelzgewandet, trägt er auch im Kontor eine schwere Astrachanmütze und an der Hand einen geschwärzten Türkisring. | Beschreibung: Ein Getreidehändler aus Riga, von dessen Lieferungen die Brotpreise und damit der Friede der Stadt abhängen. Sein gebrochenes Deutsch verbirgt einen schlauen, geduldigen Geschäftssinn. | Innerer Konflikt: Er möchte als ehrlicher Lieferant geachtet werden, wird aber durch die Krise in die Rolle des wucherischen Fremden gedrängt. | Entwicklung: Der misstrauisch beäugte Außenseiter erweist sich als unerwarteter Verbündeter, als die Stadt am Rande einer Hungersnot steht.
  - Madeleine Lefèvre | Alter: 37 | Rolle: Pariser Modistin | Aussehen: Klein und lebhaft, mit raschen schwarzen Augen und einem extravaganten, mit Reiherfedern besetzten Hut, der in der grauen Stadt wie ein fremder Vogel wirkt. | Beschreibung: Eine Modistin aus Paris, die in der Stadt ein Putzgeschäft für die Damen der Häuser eröffnet hat. In ihren Salon trägt man die Geheimnisse der feinen Welt wie alte Spitzen zum Ausbessern. | Innerer Konflikt: Ihr Geschäft lebt vom Luxus der Reichen, doch ihr Mitgefühl gilt heimlich denen, die unter deren Hochmut leiden. | Entwicklung: Aus der pikanten Außenseiterin wird eine Vertraute der Frauen, die im Verborgenen Fäden zwischen den verfeindeten Häusern knüpft.
  - Henry Pembroke | Alter: 45 | Rolle: Versicherungsagent von Lloyd's | Aussehen: Korrekt und blass, mit einem schwarzen Lederbuch unter dem Arm und einem Glasauge, das nie zu blinzeln scheint. | Beschreibung: Ein Agent der Londoner Seeversicherung, der die zweifelhaften Schiffsunglücke der Krisenmonate untersucht. Wo Schiffe sinken und Versicherungssummen fließen, wittert er Betrug. | Innerer Konflikt: Seine Pflicht gegenüber den Versicherern verlangt schonungslose Aufklärung, doch ein menschliches Zögern hält ihn ab, ein altes Haus vollends zu vernichten. | Entwicklung: Der unbeirrbare Ermittler kommt einem Versicherungsbetrug auf die Spur, der die ganze Stadt erschüttern könnte.
  - Konrad Rosenthal | Alter: 51 | Rolle: Kaiserlicher Steuerinspektor | Aussehen: Dürr und akkurat, mit einem stets frisch gespitzten Bleistift hinterm Ohr und einer schwarzen Aktentasche, die er nie aus der Hand legt. | Beschreibung: Ein vom Reich entsandter Steuerinspektor, der die undurchsichtigen Bücher der Kaufmannshäuser prüfen soll. Die alteingesessenen Familien sehen in ihm den langen Arm des fernen Berlin. | Innerer Konflikt: Seine pflichtgemäße Gründlichkeit deckt Verfehlungen auf, deren Verfolgung Existenzen zerstört, was sein Gewissen belastet. | Entwicklung: Der gefürchtete Beamte gerät zwischen die Treue zum Reich und ein wachsendes Verständnis für die bedrängte Stadt.
  - Elias Thorne | Alter: 56 | Rolle: Wandernder Bußprediger | Aussehen: Ausgemergelt und barfuß trotz des Winters, mit einem wirren grauen Bart und brennenden Augen, die in einem zerschlissenen Pilgermantel über der Stadt zu schweben scheinen. | Beschreibung: Ein fahrender Prediger ohne Amt und Heimat, der auf dem Marktplatz das nahe Strafgericht über die habgierige Stadt verkündet. Die einen verlachen ihn, die anderen fürchten seine Worte wie eine Prophezeiung. | Innerer Konflikt: Sein Ruf nach Umkehr speist sich ebenso aus echtem Glaubenseifer wie aus dem Groll eines einst selbst gescheiterten Mannes. | Entwicklung: Der spöttisch geduldete Außenseiter wird in der vertiefenden Krise zur unheimlichen Stimme, die der Stadt ihren Untergang vorhält.
  ORTE UND DINGE:
  - Altstadt von Saltzbrück | Art: Ort | Beschreibung: Das von Giebelhäusern und engen Gassen durchzogene Herz der Hansestadt, in dem die alteingesessenen Kaufmannsfamilien seit Generationen wohnen. Hier verdichtet sich der Glanz und der Hochmut der fünf Dynastien.
  - Das Hafenviertel | Art: Ort | Beschreibung: Das geschäftige Ufergebiet, wo Frachten gelöscht und verladen werden und die Krane gegen den Winterhimmel ragen. In der Handelskrise von 1887 liegt es ungewöhnlich still.
  - Die Speicherstadt | Art: Ort | Beschreibung: Eine dicht gedrängte Reihe backsteinerner Lagerhäuser am Wasser, in denen Korn, Salz, Tuche und Kolonialwaren der Kaufleute ruhen. Ihr Wert und ihre Schulden bilden das Rückgrat der Stadt.
  - Der Marktplatz | Art: Ort | Beschreibung: Das gepflasterte Zentrum Saltzbrücks zwischen Rathaus und Marienkirche, auf dem Wochenmarkt und Gerücht gleichermaßen gedeihen. Hier wird über die umstrittene Erbschaft der Brandts geflüstert.
  - Das Rathaus | Art: Ort | Beschreibung: Der ehrwürdige Backsteinbau mit der Ratsstube, in dem die Senatoren und Bürgermeister der Stadt tagen. Über die Erbstreitigkeiten und die Krise wird hinter seinen schweren Türen verhandelt.
  - Die Kaufmannsbörse | Art: Ort | Beschreibung: Der Versammlungssaal, in dem Wechsel gehandelt, Frachtraten ausgerufen und Vermögen gemacht oder vernichtet werden. Im Winter 1887 herrscht hier die nervöse Stille der Handelskrise.
  - Die Marienkirche | Art: Ort | Beschreibung: Die mächtige gotische Backsteinkirche, deren Türme über Saltzbrück wachen und in deren Gestühl die Kaufmannsfamilien ihre angestammten Bänke besitzen. Hier finden Taufen, Hochzeiten und Begräbnisse der Dynastien statt.
  - Der Friedhof | Art: Ort | Beschreibung: Die von Linden beschattete Begräbnisstätte hinter der Marienkirche, wo die Patriarchen der fünf Familien in prunkvollen Grüften liegen. Hier wurde Heinrich Brandt zur letzten Ruhe gebettet.
  - Das Armenhaus | Art: Ort | Beschreibung: Eine düstere Stiftung am Rand der Altstadt, in der die Verarmten und Gescheiterten der Stadt Unterkunft finden. In der Handelskrise füllen sich seine Säle bedenklich.
  - Kontor Brandt & Söhne | Art: Ort | Beschreibung: Das vornehmste Handelshaus Saltzbrücks am Marktplatz, einst von Heinrich Brandt zu größtem Ansehen geführt. Nach seinem Tod schwelt hier der Streit um das Erbe und die Leitung.
  - Kontor Vögel & Companie | Art: Ort | Beschreibung: Das Handelshaus der Familie Vögel im Hafenviertel, bekannt für seinen Ostseehandel mit Korn und Holz. Es buhlt seit Jahren mit den Brandts um die Vormacht in der Stadt.
  - Kontor Reuter | Art: Ort | Beschreibung: Das alteingesessene Handelshaus der Reuters an der Speicherstadt, das vor allem mit Salz und Kolonialwaren handelt. Die Krise hat seine Bücher in Bedrängnis gebracht.
  - Kontor Sahlmann | Art: Ort | Beschreibung: Das nüchterne Handelshaus der Familie Sahlmann nahe der Börse, von vorsichtigen, frommen Kaufleuten geführt. Es gilt als das verschwiegenste Kontor der Stadt.
  - Kontor Coorman | Art: Ort | Beschreibung: Das jüngste der fünf großen Handelshäuser, von dem ehrgeizigen Geschlecht der Coorman im Hafenviertel betrieben. Es sucht in der Krise nach Gelegenheit, in den Kreis der ersten Familien aufzusteigen.
  - Der Salzspeicher am Kai | Art: Ort | Beschreibung: Ein gewaltiges Lagerhaus der Reuters unmittelbar am Wasser, in dem das namengebende Salz der Stadt gestapelt wird. Sein modriger Geruch hängt über dem ganzen Viertel.
  - Der Kornspeicher Brandt | Art: Ort | Beschreibung: Der größte Getreidespeicher der Speicherstadt, Eigentum des Hauses Brandt und Sinnbild seines Reichtums. Sein Inhalt und sein Wert sind Teil der umstrittenen Erbmasse.
  - Das Zunfthaus | Art: Ort | Beschreibung: Der getäfelte Versammlungsort der Handwerks- und Schifferzünfte Saltzbrücks, in dem altes Recht und alte Bräuche gewahrt werden. Hier verkehren Schiffer, Böttcher und Krämer der Stadt.
  - Der Leuchtturm von Saltzbrück | Art: Ort | Beschreibung: Der weiß getünchte Turm an der Hafeneinfahrt, dessen Feuer die heimkehrenden Schiffe durch die Dunkelheit leitet. In Sturmnächten ist er die letzte Hoffnung der Seeleute.
  - Die zugefrorene Trave | Art: Ort | Beschreibung: Der Fluss und Hafenstrom, an dem Saltzbrück liegt und auf dem aller Handel ruht. INVARIANTE: Im Winter friert die Trave zu und legt die Schifffahrt lahm; im Frühjahr taut sie wieder auf und gibt den Hafen frei.
  - Die Steinerne Brücke | Art: Ort | Beschreibung: Die alte Bogenbrücke, die Altstadt und Hafenviertel über die Trave verbindet und der Treffpunkt für heimliche Verabredungen ist. Im Winter steht sie über dem gefrorenen Strom.
  - Wirtshaus Zum Anker | Art: Ort | Beschreibung: Das verräucherte Wirtshaus am Kai, in dem Schiffer, Lotsen und Kaufmannsdiener bei Branntwein zusammensitzen. Hier laufen Gerüchte und Neuigkeiten aus aller Welt zusammen.
  - Die Wendin | Art: Gegenstand | Beschreibung: Ein stolzes Handelsschiff des Hauses Brandt, das 1885 in einem Herbststurm mit Mann und Maus unterging. INVARIANTE: Die Wendin ist gesunken und existiert nur noch als Erinnerung und Wrack; sie darf niemals als fahrendes Schiff auftreten.
  - Die Falke | Art: Gegenstand | Beschreibung: Ein schneller Dreimaster der Familie Vögel, der den Ostseehandel mit Korn und Holz besorgt. Sie gilt als das tüchtigste Schiff der hanseatischen Flotte Saltzbrücks.
  - Die Hanseatin | Art: Gegenstand | Beschreibung: Ein bewährtes Handelsschiff des Hauses Reuter, das Salz und Kolonialwaren über die See bringt. In der Krise liegt sie oft untätig im vereisten Hafen.
  - Die Margaretha | Art: Gegenstand | Beschreibung: Ein Frachtsegler des Hauses Coorman, benannt nach der Stammmutter der Familie. Mit ihr versucht das junge Geschlecht, seinen Aufstieg im Seehandel zu sichern.
  - Das Testament Heinrich Brandts | Art: Gegenstand | Beschreibung: Die letztwillige Verfügung des verstorbenen Patriarchen Heinrich Brandt über sein Vermögen und die Leitung des Kontors. INVARIANTE: Das Testament ist umstritten; seine Echtheit und Auslegung werden von den Erben angefochten und bleiben ungeklärt.
  - Die Kontorbücher des Hauses Brandt | Art: Gegenstand | Beschreibung: Die in Leder gebundenen Handels- und Rechnungsbücher, in denen jeder Wechsel, jede Fracht und jede Schuld des Hauses Brandt verzeichnet ist. In ihnen verbirgt sich das wahre Ausmaß der Krise.
  - Der Siegelring der Brandts | Art: Gegenstand | Beschreibung: Ein schwerer goldener Ring mit dem Wappen der Familie Brandt, mit dem der Patriarch seit Generationen Verträge und Briefe siegelt. Sein Besitz gilt als Zeichen der rechtmäßigen Hauptmacht über das Kontor.
  - Der Wechsel über zwölftausend Mark | Art: Gegenstand | Beschreibung: Ein Schuldschein, mit dem sich das Haus Reuter gegenüber den Brandts verpflichtet hat und dessen Fälligkeit in die Zeit der Krise fällt. Seine Einlösung könnte ein ganzes Kontor stürzen.
  - Die Schiffsglocke der Wendin | Art: Gegenstand | Beschreibung: Die bronzene Glocke des untergegangenen Schiffes, die Fischer Jahre nach dem Unglück aus der See bargen. Sie hängt nun als stummes Mahnmal im Kontor Brandt und erinnert an die verlorene Mannschaft.
  - Das Bildnis des Stammvaters | Art: Gegenstand | Beschreibung: Ein großes Ölgemälde des Geschlechtsgründers Cornelius Brandt, das streng über dem Kontortisch hängt. Sein Blick scheint über jeden Streit der Erben zu wachen.
  - Der versiegelte Brief Heinrich Brandts | Art: Gegenstand | Beschreibung: Ein noch ungeöffnetes, mit dem Brandt-Siegel verschlossenes Schreiben des Patriarchen, das erst nach seinem Tode auftauchte. Sein Inhalt könnte den Erbstreit entscheiden oder vertiefen.
  - Die silberne Tabaksdose der Sahlmanns | Art: Gegenstand | Beschreibung: Eine ziselierte Dose aus dem Besitz der frommen Familie Sahlmann, die seit drei Generationen am Verhandlungstisch herumgereicht wird. Sie gilt als Talisman für glückliche Geschäfte.
  KAPITELPLAN (alle Kapitel des Buches):
  1. Der Tod des Patriarchen — Heinrich Brandt stirbt im Schlafzimmer des Hauses Brandt; Anna Brandt und ihr Bruder Friedrich wachen, die Witwe Magdalene ordnet die ersten Schritte. Die Stadt beginnt zu reden.
  2. Die Testamentseröffnung — Beim Notar wird Heinrich Brandts Testament eröffnet: nicht Friedrich, sondern überraschend eine andere Person ist eingesetzt. Friedrich ist fassungslos, Anna beginnt zu rechnen.
  3. Das Haus Vögel triumphiert — Im Hause Vögel wittern der cholerische Patriarch Heinrich Vögel und sein kalter Sohn Johann die Chance, die geschwächten Brandts zu überflügeln.
  4. Drei Annas auf dem Wohltätigkeitsball — Auf dem winterlichen Ball begegnen sich Anna Brandt, Anna Vögel und Anna Reuter; Allianzen und Rivalitäten werden im Tanz verhandelt. Gustav Sahlmann umkreist Anna Brandt.
  5. Faule Wechsel — Friedrich Reuter durchschaut beim Bücherführen die faulen Wechsel, mit denen Johann Vögel die Brandts in die Enge treibt. Er trägt es Anna Brandt zu.
  6. Der Krisenwinter und die zugefrorene Trave — Die Trave friert zu, der Handel stockt, die Speicher der Stadt leeren sich. Gustav Sahlmann spekuliert gegen die Brandts. Anna sucht ein Bündnis mit den Coormans.
  7. Das Bündnis der Coormans — Anna Brandt reist ins Coorman-Kontor; ihr Onkel Pieter Coorman und ihr Cousin Cornelis bieten Hilfe, doch um einen Preis. Anneke bringt eine Nachricht aus Amsterdam.
  8. Die verlorene Ladung der Wendin — Jan Coorman entdeckt, dass die 1885 verlorene Ladung der gesunkenen Wendin doch nicht verloren ist. Das ändert die Rechnung des Erbstreits. (Das Schiff selbst bleibt gesunken.)
  9. Tante Augustes Gedächtnis — Die greise Auguste Brandt enthüllt Anna ein altes Familiengeheimnis, das erklärt, warum Heinrich seinen Erstgeborenen überging.
  10. Der Verrat im Haus Sahlmann — Otto Sahlmanns Fehler und die Zeugin Frieda Sahlmann bringen Gustavs Intrige ans Licht. Marie Sahlmann wechselt die Seite.
  11. Wilhelms Schuld — Der verschuldete Wilhelm Brandt erweist sich überraschend als Schlüssel zur Erbenfrage: Eine seiner Spielschulden verbindet ihn mit dem wahren Erben.
  12. Der wahre Erbe — Der versiegelte Brief und Augustes Wissen enthüllen, wer Heinrich Brandt wirklich eingesetzt hat. Die Häuser ordnen sich neu.
  13. Tauwetter über der Trave — Das Eis bricht, der Handel kommt wieder in Gang. Anna Brandt steht als eigentliche Lenkerin des Hauses; Friedrich findet seinen Frieden, Gustav Sahlmann ist geschlagen, die Coorman-Allianz besiegelt.
